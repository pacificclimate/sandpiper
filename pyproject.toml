[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "sandpiper"
version = "1.7.1"
description = "A Web Processing Service for the Plan2Adapt Rule Engine."
authors = [{ name = "Nikola Rados" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
keywords = [
    "wps",
    "pywps",
    "birdhouse",
    "sandpiper",
    "plan2adapt",
    "climate",
    "adaptation",
]
license = { text = "GNU General Public License v3" }
readme = "README.md"
requires-python = ">=3.11, <=3.14"
dependencies = [
    "click>=8.2.1,<9.0.0",
    "cf_cell_methods>=0.1.0,<1.0.0",
    "gdal>=3.3.3,<3.4",
    "gunicorn>=23.0.0,<24.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "numpy>=1.26.4,<2.0.0",
    "pint>=0.24.4,<0.25",
    "psutil>=7.0.0,<8.0.0",
    "pyproj>=3.7.1,<4.0.0",
    "pywps>=4.6.0,<5.0.0",
    "shapely>=2.1.1,<3.0.0",
    "pywps>=4.6.0",
    "p2a_impacts@ git+https://github.com/pacificclimate//p2a-rule-engine.git@py-sprint-25q1",
    "wps-tools @ git+https://github.com/pacificclimate/wps-tools.git@py-sprint-25q1",
    "ce @ git+https://github.com/pacificclimate/climate-explorer-backend.git@py-sprint-25q1",
    "modelmeta @ git+https://github.com/pacificclimate/modelmeta.git@py-sprint-25q1",
]

[project.optional-dependencies]
dev = [
    "nbval>=0.9.6",
    "beautifulsoup4>=4.13.4,<5.0.0",
    "beautifulsoup4>=4.13.4,<5.0.0",
    "birdhouse_birdy>=0.8.7,<1.0.0",
    "black>=25.1.0,<26.0.0",
    "bumpversion>=0.6.0,<1.0.0",
    "cruft>=2.16.0,<3.0.0",
    "flake8>=7.2.0,<8.0.0",
    "ipython>=9.3.0,<10.0.0",
    "ipywidgets>=8.1.7,<9.0.0",
    "jupyterlab>=4.4.3,<5.0.0",
    "nbconvert>=7.16.6,<8.0.0",
    "nbsphinx>=0.9.6,<1.0.0",
    "nodejs>=0.1.1,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest_flake8>=1.3.0,<2.0.0",
    "pytest_notebook>=0.10.0,<1.0.0",
    "sphinx>=8.2.3,<9.0.0",

]

[project.scripts]
sandpiper = "sandpiper.cli:cli"


[project.urls]
homepage = "http://www.pacificclimate.org/"
repository = "https://github.com/pacificclimate/sandpiper"

[tool.pytest.ini_options]
markers = [
    "online: marks tests that use online resources (deselect with '-m \"not online\"')",
    "slow: marks tests that are slow (deselect with '-m \"not slow\"')",
]

[[tool.poetry.include]]
path = "*.txt"
format = ["sdist", "wheel"]

[[tool.poetry.include]]
path = "*.md"
format = ["sdist", "wheel"]

[[tool.poetry.include]]
path = "sandpiper"
format = ["sdist", "wheel"]

[[tool.poetry.include]]
path = "tests/data/configs/*.cfg"
format = ["sdist", "wheel"]

[[tool.poetry.source]]
name = "pcic"
url = "https://pypi.pacificclimate.org/simple/"
priority = "primary"

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "docs/source/conf.py", "build", "dist", "src"]

[tool.doc8]
ignore-path = ["docs/build", "docs/source/_templates", "docs/source/_static"]
max-line-length = 120


[tool.poe.tasks]


# ── Python env via Poetry ────────────────────────────────────
[tool.poe.tasks.lock]
cmd = "poetry lock"
help = "Build the lock file for the project"

[tool.poe.tasks.install]
cmd = "poetry install"
help = "Install Python project dependencies using Poetry"

[tool.poe.tasks.develop]
cmd = "poetry install --extras dev"
help = "Install development dependencies using Poetry"

[tool.poe.tasks.start]
cmd = "poetry run sandpiper start -d"
help = "Start the Sandpiper service in detached mode"

[tool.poe.tasks.stop]
cmd = "poetry run sandpiper stop"
help = "Stop the Sandpiper service"

[tool.poe.tasks.restart]
sequence = ["stop", "start"]
help = "Restart the Sandpiper service"

[tool.poe.tasks.status]
cmd = "poetry run sandpiper status"
help = "Show the status of the Sandpiper service"

[tool.poe.tasks.dist]
cmd = "poetry build"
help = "Build a distribution package for the project"

# ── Tests & lint ─────────────────────────────────────────────

[tool.poe.tasks.test]
cmd = "pytest -v -m 'not slow and not online' tests/"
help = "Run fast, offline unit tests"

[tool.poe.tasks.test-all]
cmd = "pytest -v tests/"
help = "Run all tests, including online ones"

[tool.poe.tasks.lint]
cmd = "black . --check"
help = "Check code formatting using Black"

# ── Notebook tasks ──────────────────────────────────────────

[tool.poe.tasks.prepare-notebooks]
cmd = "curl -L https://github.com/Ouranosinc/PAVICS-e2e-workflow-tests/raw/master/notebooks/output-sanitize.cfg -o docs/output-sanitize.cfg --silent"
help = "Download the output sanitizer config for notebook tests"

[tool.poe.tasks.test-notebooks]
sequence = ["prepare-notebooks", "test-notebooks-local"]
help = "Run all local notebook tests with sanitized output"

[tool.poe.tasks.test-notebooks-local]
cmd = "pytest --nbval --verbose notebooks/ --sanitize-with docs/output-sanitize.cfg --ignore notebooks/.ipynb_checkpoints"
env = { LOCAL_URL = "http://localhost:5000" }
help = "Run notebook tests locally using nbval with sanitization"

